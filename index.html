<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResQ Admin Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

    <div class="login-card">
        <i class="fas fa-user-shield" style="font-size: 3em; color: var(--primary-color); margin-bottom: 10px;"></i>
        <h2>Admin Dashboard Login</h2>
        <form id="adminLoginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter username (admin)" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password (admin)" required>
            </div>
            <button type="submit" class="main-button">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
        </form>
    </div>

    <div id="customMessageBox"></div>

    <script type="module" src="admin.js"></script>
</body>
</html>
